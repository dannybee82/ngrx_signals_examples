<div class="col w-50 p-1">
    @if(bookStore.isLoading()) {
        <p>Loading...</p>
    } @else {
        <h2>Books</h2>
        <app-book-list 
            [books]="bookStore.books()" 
            (add)="bookStore.addBook($event)">
        </app-book-list>

        <h2>My Collection</h2>
        <app-book-collection 
            [books]="bookStore.collection()" 
            (remove)="bookStore.removeBook($event)"
        ></app-book-collection>
    }
</div>
